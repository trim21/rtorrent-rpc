name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          activate-environment: true

      - run: uv sync --locked --extra dev

      - name: ty
        run: ty check . --output-format=github

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true

      - run: uv sync --locked --extra dev

      - uses: jakebailey/pyright-action@v3.0.2
        with:
          version: "1.1.414"

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: trim21/actions/prek@master
