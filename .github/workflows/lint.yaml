name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
          activate-environment: true

      - run: uv sync --locked --extra dev

      - uses: liskin/gh-problem-matcher-wrap@v4
        with:
          action: add
          linters: mypy

      - name: mypy
        run: mypy --show-column-numbers rtorrent_rpc

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: trim21/actions/prek@master
