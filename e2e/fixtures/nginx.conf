upstream rtorrent {
    server unix:/var/run/rtorrent/rtorrent.sock;
}

server {
    listen 80;
    server_name _;

    location ^~ /plain {
        include scgi_params;
        scgi_pass rtorrent;
    }

    location ^~ /basic {
        include scgi_params;
        scgi_pass rtorrent;
        auth_basic "Test Area";
        auth_basic_user_file /etc/nginx/password;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location ^~ /plain {
        include scgi_params;
        scgi_pass rtorrent;
    }

    location ^~ /basic {
        include scgi_params;
        scgi_pass rtorrent;
        auth_basic "Test Area";
        auth_basic_user_file /etc/nginx/password;
    }
}